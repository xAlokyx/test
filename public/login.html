<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - نظام إدارة المحتوى العربي</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      padding: var(--spacing-lg);
    }

    .login-card {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      padding: var(--spacing-2xl);
      box-shadow: var(--shadow-xl);
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }

    .login-logo {
      font-size: 3rem;
      margin-bottom: var(--spacing-md);
    }

    .login-title {
      font-size: 1.75rem;
      font-weight: bold;
      color: var(--text-primary);
      margin-bottom: var(--spacing-sm);
    }

    .login-subtitle {
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">🔐</div>
        <h1 class="login-title">تسجيل الدخول</h1>
        <p class="login-subtitle">لوحة تحكم المدير</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">اسم المستخدم</label>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            placeholder="أدخل اسم المستخدم"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="أدخل كلمة المرور"
            required
            autocomplete="current-password"
          >
        </div>

        <div id="errorMessage" class="hidden"></div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          تسجيل الدخول
        </button>
      </form>

      <div style="margin-top: var(--spacing-lg); padding-top: var(--spacing-lg); border-top: 1px solid var(--border); text-align: center;">
        <p style="color: var(--text-secondary); font-size: 0.875rem;">
          بيانات الدخول الافتراضية:<br>
          <strong>admin</strong> / <strong>admin123</strong>
        </p>
        <a href="/" class="btn btn-secondary" style="margin-top: var(--spacing-md); width: 100%;">
          العودة للصفحة الرئيسية
        </a>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    // التحقق من وجود token
    const token = localStorage.getItem('token');
    if (token) {
      // التحقق من صلاحية الـ token
      fetch('/api/auth/verify', {
        headers: { 'Authorization': `Bearer ${token}` }
      })
      .then(res => res.json())
      .then(data => {
        if (data.valid) {
          window.location.href = '/admin/';
        }
      });
    }

    // معالجة تسجيل الدخول
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      errorDiv.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري تسجيل الدخول...';

      try {
        const data = await api.post('/auth/login', { username, password });
        
        // حفظ الـ token
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        
        // إعادة التوجيه
        window.location.href = '/admin/';
      } catch (error) {
        errorDiv.className = 'alert alert-error';
        errorDiv.textContent = error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'تسجيل الدخول';
      }
    });

    // تهيئة الوضع الداكن
    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    });
  </script>
</body>
</html>
