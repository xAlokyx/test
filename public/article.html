<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="عرض المقال">
  <title id="pageTitle">المقال - نظام إدارة المحتوى العربي</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .article-full {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .article-full-image {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: var(--radius-lg);
      margin-bottom: var(--spacing-lg);
    }
    
    .article-full-content {
      font-size: 1.125rem;
      line-height: 1.8;
      color: var(--text-primary);
    }
    
    .article-full-content h2 {
      margin-top: var(--spacing-xl);
      margin-bottom: var(--spacing-md);
      color: var(--text-primary);
    }
    
    .article-full-content h3 {
      margin-top: var(--spacing-lg);
      margin-bottom: var(--spacing-sm);
      color: var(--text-primary);
    }
    
    .article-full-content p {
      margin-bottom: var(--spacing-md);
    }
    
    .article-full-content ul,
    .article-full-content ol {
      margin-right: var(--spacing-lg);
      margin-bottom: var(--spacing-md);
    }
    
    .article-full-content li {
      margin-bottom: var(--spacing-sm);
    }

    .article-header {
      margin-bottom: var(--spacing-xl);
      padding-bottom: var(--spacing-lg);
      border-bottom: 2px solid var(--border);
    }

    .article-tags {
      display: flex;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
      margin-top: var(--spacing-md);
    }
  </style>
</head>
<body>
  <!-- الترويسة -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">📝 نظام إدارة المحتوى</a>
        <nav class="nav">
          <a href="/" class="nav-link">الرئيسية</a>
          <a href="/articles.html" class="nav-link">المقالات</a>
          <a href="/login.html" class="nav-link">تسجيل الدخول</a>
          <button id="themeToggle" class="theme-toggle">🌙</button>
        </nav>
      </div>
    </div>
  </header>

  <!-- محتوى المقال -->
  <section class="section">
    <div class="container">
      <div class="article-full">
        <div id="articleContent">
          <div class="text-center">
            <div class="spinner" style="width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; margin: 2rem auto;"></div>
            <p>جاري تحميل المقال...</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- التذييل -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 نظام إدارة المحتوى العربي - جميع الحقوق محفوظة</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    // الحصول على slug من URL
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    async function loadArticle() {
      if (!slug) {
        document.getElementById('articleContent').innerHTML = 
          '<div class="alert alert-error">المقال غير موجود</div>';
        return;
      }

      try {
        const article = await api.get(`/articles/${slug}`);
        
        // تحديث عنوان الصفحة
        document.getElementById('pageTitle').textContent = `${article.title} - نظام إدارة المحتوى العربي`;
        
        // تحديث SEO meta tags
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc && article.excerpt) {
          metaDesc.content = article.excerpt;
        }

        // عرض المقال
        const container = document.getElementById('articleContent');
        container.innerHTML = `
          <div class="article-header">
            <h1 style="font-size: 2.5rem; margin-bottom: var(--spacing-md); color: var(--text-primary);">
              ${article.title}
            </h1>
            <div class="article-meta flex" style="font-size: 1rem;">
              ${article.category ? `<span class="article-category">${article.category}</span>` : ''}
              <span>📅 ${formatDate(article.published_at || article.created_at)}</span>
              ${article.views ? `<span>👁️ ${article.views} مشاهدة</span>` : ''}
            </div>
            ${article.tags ? `
              <div class="article-tags">
                ${article.tags.split(',').map(tag => `<span class="badge badge-primary">${tag.trim()}</span>`).join('')}
              </div>
            ` : ''}
          </div>

          ${article.image ? `<img src="${article.image}" alt="${article.title}" class="article-full-image" loading="lazy">` : ''}
          
          ${article.excerpt ? `
            <div class="alert alert-info" style="margin-bottom: var(--spacing-xl);">
              <strong>ملخص:</strong> ${article.excerpt}
            </div>
          ` : ''}

          <div class="article-full-content">
            ${article.content}
          </div>

          <div style="margin-top: var(--spacing-2xl); padding-top: var(--spacing-lg); border-top: 1px solid var(--border); text-align: center;">
            <a href="/articles.html" class="btn btn-primary">← العودة إلى المقالات</a>
          </div>
        `;

        // تفعيل lazy loading للصور
        lazyLoadImages();
      } catch (error) {
        console.error('خطأ في تحميل المقال:', error);
        document.getElementById('articleContent').innerHTML = 
          '<div class="alert alert-error">حدث خطأ في تحميل المقال</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadArticle);
  </script>
</body>
</html>
